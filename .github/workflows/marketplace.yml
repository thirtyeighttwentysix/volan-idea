name: Publish to JetBrains Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed GitHub Release tag (e.g. v0.3.0)
        required: true
        type: string
      channel:
        description: Marketplace update channel
        default: default
        required: true
        type: choice
        options: [default, beta]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    timeout-minutes: 25
    steps:
      - name: Validate inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || exit 1
          [[ "$CHANNEL" == default || "$CHANNEL" == beta ]] || exit 1
          if [[ "$RELEASE_TAG" == *-* && "$CHANNEL" == default ]]; then
            echo 'Pre-release versions must use the beta channel'; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
      - name: Download and check release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p build/release
          gh release download "$RELEASE_TAG" --pattern '*-signed.zip' --pattern SHA256SUMS --dir build/release
          python3 scripts/release.py check-asset --tag "$RELEASE_TAG" --directory build/release
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Verify signature and publish exact asset
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          test -n "$PUBLISH_TOKEN" || { echo 'Configure marketplace environment secret PUBLISH_TOKEN'; exit 1; }
          archive="$PWD/build/release/volan-idea-${RELEASE_TAG#v}-signed.zip"
          ./gradlew verifyPluginSignature publishPlugin -PpublishArchive="$archive" \
            -PmarketplaceChannel="$CHANNEL" -x buildPlugin -x signPlugin --no-configuration-cache --console=plain
